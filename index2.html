<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCRM v5.0 - Sistema Maestro Full</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700;900&display=swap');
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- MAPEO DE ICONOS LUCIDE (Para que funcionen sin import) ---
        const LucideIcon = ({ name, className = "w-4 h-4" }) => {
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // Alias para mantener tu código original intacto
        const Users = (p) => <LucideIcon name="users" {...p} />;
        const Leaf = (p) => <LucideIcon name="leaf" {...p} />;
        const CalendarDays = (p) => <LucideIcon name="calendar-days" {...p} />;
        const Wallet = (p) => <LucideIcon name="wallet" {...p} />;
        const Settings = (p) => <LucideIcon name="settings" {...p} />;
        const Search = (p) => <LucideIcon name="search" {...p} />;
        const Plus = (p) => <LucideIcon name="plus" {...p} />;
        const Bell = (p) => <LucideIcon name="bell" {...p} />;
        const X = (p) => <LucideIcon name="x" {...p} />;
        const ChevronRight = (p) => <LucideIcon name="chevron-right" {...p} />;
        const ArrowLeft = (p) => <LucideIcon name="arrow-left" {...p} />;
        const Phone = (p) => <LucideIcon name="phone" {...p} />;
        const Mail = (p) => <LucideIcon name="mail" {...p} />;
        const History = (p) => <LucideIcon name="history" {...p} />;
        const FileText = (p) => <LucideIcon name="file-text" {...p} />;
        const Save = (p) => <LucideIcon name="save" {...p} />;
        const Edit2 = (p) => <LucideIcon name="edit-2" {...p} />;
        const Utensils = (p) => <LucideIcon name="utensils" {...p} />;
        const ClipboardList = (p) => <LucideIcon name="clipboard-list" {...p} />;
        const Clock = (p) => <LucideIcon name="clock" {...p} />;
        const Download = (p) => <LucideIcon name="download" {...p} />;
        const Stethoscope = (p) => <LucideIcon name="stethoscope" {...p} />;
        const Activity = (p) => <LucideIcon name="activity" {...p} />;
        const ClipboardCheck = (p) => <LucideIcon name="clipboard-check" {...p} />;
        const Printer = (p) => <LucideIcon name="printer" {...p} />;
        const CheckSquare = (p) => <LucideIcon name="check-square" {...p} />;
        const Trash2 = (p) => <LucideIcon name="trash-2" {...p} />;
        const Package = (p) => <LucideIcon name="package" {...p} />;
        const Upload = (p) => <LucideIcon name="upload" {...p} />;
        const FileSpreadsheet = (p) => <LucideIcon name="file-spreadsheet" {...p} />;
        const ImageIcon = (p) => <LucideIcon name="image" {...p} />;
        const Check = (p) => <LucideIcon name="check" {...p} />;
        const PlusCircle = (p) => <LucideIcon name="plus-circle" {...p} />;
        const Type = (p) => <LucideIcon name="type" {...p} />;
        const Tag = (p) => <LucideIcon name="tag" {...p} />;
        const Monitor = (p) => <LucideIcon name="monitor" {...p} />;
        const Info = (p) => <LucideIcon name="info" {...p} />;
        const FlaskConical = (p) => <LucideIcon name="flask-conical" {...p} />;
        const Zap = (p) => <LucideIcon name="zap" {...p} />;
        const Scale = (p) => <LucideIcon name="scale" {...p} />;
        const Calculator = (p) => <LucideIcon name="calculator" {...p} />;
        const CalendarPlus = (p) => <LucideIcon name="calendar-plus" {...p} />;

        const GRUPOS_SMAE = [
            "Fruta", "Verdura", "Cereales con grasa", "Cereales sin grasa",
            "Alimentos de origen animal de muy bajo aporte de grasa",
            "Alimentos de origen animal de bajo aporte de grasa",
            "Alimentos de origen animal de moderado aporte de grasa",
            "Alimentos de origen animal de alto aporte de grasa",
            "Leguminosas", "Lácteos enteros", "Lácteos descremados", "Lácteos semidescremados",
            "Grasas con proteína", "Grasas sin proteína", "Azúcares con grasa", "Azúcares sin grasa", "Alimentos libres"
        ];

        // --- COMPONENTES UI ORIGINALES ---
        const Label = ({ children, className = "" }) => <label className={`block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1 leading-none ${className}`}>{children}</label>;
        const FormInput = ({ value, onChange, type = "text", placeholder = "", className = "", readOnly = false }) => (
            <input type={type} value={value || ''} onChange={onChange} placeholder={placeholder} readOnly={readOnly} className={`w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all shadow-inner ${className}`} />
        );
        const SectionHeader = ({ title }) => <h3 className="text-[13px] font-bold text-emerald-700 uppercase tracking-[0.2em] border-b border-emerald-100 pb-2 flex items-center italic mb-6"><div className="w-2.5 h-2.5 bg-emerald-500 rounded-full mr-3 shadow-sm"></div> {title}</h3>;

        // --- BUSCADOR ---
        const BuscadorPacientes = ({ pacientes, selectedId, onSelect, placeholder = "Buscar paciente..." }) => {
            const [term, setTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            useEffect(() => { if(selectedId) { setTerm(pacientes.find(p=>p.id == selectedId)?.nombre || ''); } else { setTerm(''); } }, [selectedId, pacientes]);
            const filtered = pacientes.filter(p => p.nombre.toLowerCase().includes(term.toLowerCase()));
            return (
                <div className="relative w-full">
                    <div className="relative">
                        <Search className="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                        <input type="text" className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all shadow-inner" placeholder={placeholder} value={term} onChange={(e) => { setTerm(e.target.value); setIsOpen(true); if(!e.target.value) onSelect(''); }} onFocus={() => setIsOpen(true)} onBlur={() => setTimeout(()=>setIsOpen(false), 200)} />
                    </div>
                    {isOpen && filtered.length > 0 && (
                        <div className="absolute z-50 w-full mt-2 bg-white border border-slate-200 rounded-xl shadow-xl max-h-48 overflow-y-auto">
                            {filtered.map(p => (
                                <div key={p.id} className="p-3 hover:bg-emerald-50 cursor-pointer text-sm font-bold text-slate-700 border-b border-slate-50 last:border-0 transition-colors" onClick={() => { onSelect(p.id); setTerm(p.nombre); setIsOpen(false); }}>
                                    {p.nombre} <span className="text-[10px] text-slate-400 font-normal ml-2">Exp: #{p.id}</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================================================
        // COMPONENTES MODALES Y SUBMÓDULOS (TU CÓDIGO COMPLETO RESTAURADO)
        // ==========================================================================

        function ModalNuevoPaciente({ onClose, onSave }) {
            const [nombre, setNombre] = useState('');
            return (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[600] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 animate-in zoom-in duration-200 border border-white/20">
                        <div className="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                            <h3 className="font-bold text-slate-800 text-base uppercase tracking-tight italic">Nuevo Registro Maestro</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-100 rounded-full transition-colors"><X className="w-5 h-5 text-slate-400"/></button>
                        </div>
                        <div className="space-y-6">
                            <div><Label>Nombre Completo del Paciente</Label><FormInput value={nombre} onChange={(e)=>setNombre(e.target.value)} placeholder="Ej. Ana García..." autoFocus /></div>
                            <div className="flex space-x-3 pt-2">
                                <button onClick={onClose} className="flex-1 py-3 text-slate-500 font-bold text-xs uppercase hover:bg-slate-50 rounded-xl transition-all">Cancelar</button>
                                <button onClick={() => {if(!nombre.trim()) return; onSave({nombre})}} className="flex-[2] py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs uppercase shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">Crear Expediente</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ModalHistoriaClinicaCompleta({ paciente, onClose, onSave }) {
            const [datos, setDatos] = useState({ ...paciente });
            const updateField = (field, value) => setDatos(prev => ({ ...prev, [field]: value }));
            const toggleList = (field, value) => {
                const list = datos[field] || [];
                updateField(field, list.includes(value) ? list.filter(v => v !== value) : [...list, value]);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[500] flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-6xl h-[95vh] flex flex-col animate-in slide-in-from-bottom-8 duration-500 overflow-hidden border border-white/20">
                        <div className="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 shrink-0">
                            <div className="flex items-center"><div className="p-3 bg-emerald-600 rounded-xl mr-5 shadow-lg"><ClipboardCheck className="text-white w-6 h-6"/></div><div><h2 className="text-lg font-black text-slate-900 tracking-tight leading-none mb-1 uppercase italic">Ficha Clínica Integral</h2><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Sincronización SMAE v5.0 | {datos.nombre}</p></div></div>
                            <div className="flex items-center space-x-3"><button className="p-2 hover:bg-slate-100 rounded-full transition-all text-slate-400"><Printer className="w-5 h-5"/></button><button onClick={onClose} className="p-2 hover:bg-rose-50 hover:text-rose-500 rounded-full transition-all group"><X className="w-6 h-6 group-hover:rotate-90 transition-transform"/></button></div>
                        </div>
                        <div className="flex-1 overflow-y-auto px-10 py-10 space-y-12 scrollbar-hide bg-white">
                            <div className="space-y-6">
                                <SectionHeader title="I. Identificación y Antecedentes Generales" />
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                                    <div className="md:col-span-2"><Label>Nombre Completo</Label><FormInput value={datos.nombre} onChange={(e)=>updateField('nombre', e.target.value)} className="text-base font-bold text-emerald-900 uppercase italic shadow-emerald-50" /></div>
                                    <div><Label>Fecha Apertura</Label><FormInput value={datos.fecha} readOnly className="text-center opacity-60 bg-slate-100" /></div>
                                    <div><Label>Sexo</Label><select className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none appearance-none cursor-pointer" value={datos.sexo || ''} onChange={(e)=>updateField('sexo', e.target.value)}><option value="Femenino">Femenino</option><option value="Masculino">Masculino</option></select></div>
                                    <div className="md:col-span-2"><Label>Motivo de Consulta</Label><FormInput value={datos.motivoConsulta} onChange={(e)=>updateField('motivoConsulta', e.target.value)} /></div>
                                    <div className="md:col-span-2"><Label>Diagnóstico Médico Inicial</Label><textarea className="w-full p-2.5 bg-emerald-50/50 border border-emerald-100 rounded-xl font-bold text-emerald-800 text-sm outline-none shadow-inner h-20 uppercase italic" value={datos.diagnostico || ''} onChange={(e)=>updateField('diagnostico', e.target.value)} /></div>
                                    <div><Label>Edad</Label><FormInput value={datos.edad} type="number" onChange={(e)=>updateField('edad', e.target.value)} /></div>
                                    <div><Label>F. Nacimiento</Label><FormInput value={datos.fechaNacimiento} type="date" onChange={(e)=>updateField('fechaNacimiento', e.target.value)} /></div>
                                    <div><Label>Ocupación</Label><FormInput value={datos.ocupacion} onChange={(e)=>updateField('ocupacion', e.target.value)} /></div>
                                    <div><Label>Teléfono</Label><FormInput value={datos.telefono} onChange={(e)=>updateField('telefono', e.target.value)} /></div>
                                </div>
                            </div>
                            <div className="space-y-6">
                                <SectionHeader title="II. Protocolo Clínico SMAE" />
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="md:col-span-4 grid grid-cols-3 gap-6 bg-slate-900 p-6 rounded-xl shadow-lg border-b-4 border-emerald-500">
                                        <div><Label><span className="text-emerald-400">Pérdida Peso (6m)</span></Label><input className="w-full p-2.5 bg-slate-800 border-none rounded-lg font-black text-white text-center text-xl outline-none focus:ring-1 focus:ring-emerald-500" value={datos.pesoPerdido6m || ''} onChange={(e)=>updateField('pesoPerdido6m', e.target.value)} /></div>
                                        <div><Label><span className="text-emerald-400">Aumento Peso (6m)</span></Label><input className="w-full p-2.5 bg-slate-800 border-none rounded-lg font-black text-white text-center text-xl outline-none focus:ring-1 focus:ring-emerald-500" value={datos.pesoAumentado6m || ''} onChange={(e)=>updateField('pesoAumentado6m', e.target.value)} /></div>
                                        <div><Label><span className="text-emerald-400">Estatus Apetito</span></Label><select className="w-full p-2.5 bg-slate-800 border-none rounded-lg font-black text-white text-center text-xl outline-none appearance-none" value={datos.apetitoCambiado || 'Igual'} onChange={(e)=>updateField('apetitoCambiado', e.target.value)}><option value="Igual">Igual</option><option value="Aumentado">Aumentado</option><option value="Disminuido">Disminuido</option></select></div>
                                    </div>
                                    <div className="md:col-span-4 bg-white border border-emerald-50 p-6 rounded-2xl shadow-inner space-y-6">
                                        <Label>Catálogo de Antecedentes Patológicos Nutricionales</Label>
                                        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                            {['Diabetes', 'Hipertensión', 'Cardiopatías', 'Gastritis', 'Anemia', 'Sobrepeso', 'Obesidad', 'Dislipidemia', 'Cirrosis'].map(pat => (
                                                <label key={pat} className={`p-3.5 rounded-lg border font-bold uppercase text-[10px] tracking-widest flex items-center cursor-pointer transition-all ${datos.patologicos?.includes(pat) ? 'bg-emerald-600 text-white border-emerald-700 shadow-md scale-[1.02]' : 'bg-slate-50 text-slate-400 border-slate-100 hover:border-emerald-300'}`}>
                                                    <input type="checkbox" className="hidden" checked={datos.patologicos?.includes(pat)} onChange={()=>toggleList('patologicos', pat)} />
                                                    {datos.patologicos?.includes(pat) ? <Check className="w-4 h-4 mr-2" /> : <div className="w-4 h-4 mr-2 border border-slate-200 rounded" />}
                                                    {pat}
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            {/* ... (Continuación de todas las secciones de la historia clínica) */}
                            <div className="space-y-6 pb-24">
                                <SectionHeader title="IV. Antropometría Maestra y Metas" />
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="bg-slate-900 text-white p-10 rounded-3xl md:col-span-2 shadow-xl flex items-center justify-around border-b-8 border-emerald-500 group relative overflow-hidden">
                                        <div className="text-center"><p className="text-[10px] font-bold text-emerald-400 uppercase mb-3 leading-none italic">Estatura</p><input type="number" className="bg-transparent text-5xl font-black text-center w-32 outline-none border-b-2 border-emerald-800" value={datos.talla || ''} onChange={(e)=>updateField('talla', e.target.value)} /><p className="text-[9px] text-slate-500 mt-3 font-bold uppercase leading-none">Cm</p></div>
                                        <div className="w-[1px] h-20 bg-slate-800 opacity-50 mx-4"></div>
                                        <div className="text-center"><p className="text-[10px] font-bold text-emerald-400 uppercase mb-3 leading-none italic">Peso Actual</p><input type="number" className="bg-transparent text-5xl font-black text-center w-32 outline-none border-b-2 border-emerald-800" value={datos.peso || ''} onChange={(e)=>updateField('peso', e.target.value)} /><p className="text-[9px] text-slate-500 mt-3 font-bold uppercase leading-none">Kg</p></div>
                                    </div>
                                    <div className="bg-emerald-50 p-10 rounded-3xl md:col-span-2 border-2 border-emerald-100 space-y-8 flex flex-col justify-center shadow-inner">
                                        <Label>Objetivo Clínico Ponderal (Target)</Label>
                                        <div className="relative mt-2"><input type="number" className="w-full p-6 bg-white border-none rounded-xl text-5xl font-black text-emerald-900 shadow-xl text-center italic" value={datos.pesoDeseado || ''} onChange={(e)=>updateField('pesoDeseado', e.target.value)} /><span className="absolute right-6 top-1/2 -translate-y-1/2 text-xl font-black text-emerald-100 uppercase italic pointer-events-none">KG</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="px-8 py-5 border-t border-slate-100 bg-white flex space-x-5 shrink-0 z-50 shadow-inner">
                            <button onClick={onClose} className="flex-1 py-4 text-slate-400 font-bold text-xs uppercase tracking-widest hover:bg-slate-50 rounded-xl">Descartar</button>
                            <button onClick={() => onSave(datos)} className="flex-[3] py-4 bg-emerald-600 text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-xl flex items-center justify-center group active:scale-95 transition-all"><Save className="w-4 h-4 mr-3 group-hover:rotate-12 transition-transform" /> Sincronizar Ficha Maestro</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- SUBMÓDULOS DE DIETAS Y RECETAS ---
        function SubModuloMateriaPrima({ data, setData }) {
            const [showAdd, setShowAdd] = useState(false);
            const [newItem, setNewItem] = useState({ nombre: '', grupo: 'Fruta', cantSugerida: '', unidad: '', pesoBruto: 0, pesoNeto: 0, energia: 0, proteina: 0, lipidos: 0, hc: 0 });
            const handleSave = () => { if(!newItem.nombre) return; setData([...data, { id: Date.now(), ...newItem }]); setShowAdd(false); };
            const InputField = ({ label, field, type="number", colSpan="col-span-1" }) => (<div className={colSpan}><Label>{label}</Label><FormInput type={type} value={newItem[field]} onChange={(e) => setNewItem({...newItem, [field]: type === "number" ? Number(e.target.value) : e.target.value})} /></div>);
            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><button onClick={()=>setShowAdd(true)} className="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest flex items-center shadow-lg"><Plus className="w-4 h-4 mr-2 text-emerald-400" /> Nuevo Insumo SMAE</button></div>
                    {showAdd && (
                        <div className="bg-white p-8 rounded-[35px] border-2 border-emerald-500 shadow-2xl space-y-8 animate-in zoom-in-95 duration-300">
                            <h3 className="font-bold text-slate-900 uppercase text-sm tracking-widest border-b pb-4 italic">Registro Maestro SMAE</h3>
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                <div className="md:col-span-4 bg-slate-50 p-5 rounded-2xl border border-slate-100"><Label className="text-emerald-700 italic">Categoría SMAE Prioritaria</Label><select className="w-full p-3 bg-white border-2 border-emerald-100 rounded-2xl font-black text-sm outline-none" value={newItem.grupo} onChange={(e)=>setNewItem({...newItem, grupo: e.target.value})}>{GRUPOS_SMAE.map(g => <option key={g} value={g}>{g}</option>)}</select></div>
                                <InputField label="Nombre" field="nombre" type="text" colSpan="md:col-span-2" /><InputField label="Cant. Sugerida" field="cantSugerida" type="text" /><InputField label="Unidad" field="unidad" type="text" />
                                <div className="md:col-span-4 grid grid-cols-2 md:grid-cols-4 gap-5 border-t border-dashed pt-8"><InputField label="P. Neto (g)" field="pesoNeto" /><InputField label="Kcal" field="energia" /><InputField label="Prot (g)" field="proteina" /><InputField label="Lip (g)" field="lipidos" /><InputField label="HC (g)" field="hc" /></div>
                            </div>
                            <div className="flex justify-end space-x-4 border-t pt-6"><button onClick={()=>setShowAdd(false)} className="text-xs font-black text-slate-400 uppercase">Descartar</button><button onClick={handleSave} className="bg-slate-900 text-white px-10 py-3 rounded-2xl font-black text-xs uppercase shadow-xl flex items-center italic"><Save className="w-4 h-4 mr-2 text-emerald-400" /> Confirmar Sincronización</button></div>
                        </div>
                    )}
                    <div className="bg-white rounded-2xl border shadow-sm overflow-x-auto scrollbar-hide">
                        <table className="w-full text-left min-w-[1200px]">
                            <thead className="bg-slate-50 border-b text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                <tr><th className="px-10 py-6">Alimento</th><th className="px-10 py-6">Categoría</th><th className="px-10 py-6 text-center">Kcal</th><th className="px-10 py-6 text-center text-emerald-600">P (g)</th><th className="px-10 py-6 text-center text-rose-600">L (g)</th><th className="px-10 py-6 text-center text-blue-600">HC (g)</th><th className="px-10 py-6"></th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 text-sm font-medium">
                                {data.map(item => (
                                    <tr key={item.id} className="hover:bg-emerald-50/20">
                                        <td className="px-10 py-4 font-bold text-slate-900 uppercase italic">{item.nombre}</td>
                                        <td className="px-10 py-4"><span className="text-[9px] bg-emerald-50 px-2.5 py-1 rounded-full text-emerald-700 font-bold uppercase">{item.grupo}</span></td>
                                        <td className="px-10 py-4 text-center font-bold">{item.energia}</td>
                                        <td className="px-10 py-4 text-center text-emerald-700 font-bold">{item.proteina}</td>
                                        <td className="px-10 py-4 text-center text-rose-700 font-bold">{item.lipidos}</td>
                                        <td className="px-10 py-4 text-center text-blue-700 font-bold">{item.hc}</td>
                                        <td className="px-10 py-4 text-right"><button onClick={()=>setData(data.filter(i=>i.id!==item.id))} className="text-slate-300 hover:text-rose-500 transition-colors"><Trash2 className="w-4 h-4" /></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- MÓDULO PLAN NUTRICIONAL COMPLETO ---
        function SubModuloPlanNutricional({ recetas, pacientes, brandConfig }) {
            const [selectedPatientId, setSelectedPatientId] = useState('');
            const [openSelector, setOpenSelector] = useState(null); 
            const [planData, setPlanData] = useState({}); 
            const momentos = ['AL DESPERTAR', 'DESAYUNO', 'COLACIÓN 1', 'COMIDA', 'COLACIÓN 2', 'CENA'];

            const generarPDF = () => {
                const element = document.getElementById('plan-imprimible');
                const opt = { margin: 10, filename: 'Plan_Nutricional.pdf', html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
                if (window.html2pdf) window.html2pdf().set(opt).from(element).save();
            };

            return (
                <div className="space-y-6 pb-12">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-6 border-b-4 border-emerald-500 no-print">
                        <div className="w-full md:max-w-xs z-50"><Label>Vincular Plan de Alimentación</Label><BuscadorPacientes pacientes={pacientes} selectedId={selectedPatientId} onSelect={setSelectedPatientId} /></div>
                        <div className="text-right"><p className="text-[10px] font-black text-slate-400 uppercase italic opacity-60 tracking-[0.2em]">Ingesta Diaria Calculada</p><p className="text-4xl font-black text-emerald-600 leading-none tracking-tighter italic">1,850 <span className="text-xs font-bold text-slate-300 ml-1 uppercase leading-none">Kcal / Día</span></p></div>
                    </div>
                    
                    <div id="plan-imprimible" className="bg-white rounded-3xl border shadow-xl overflow-hidden relative">
                        <div className="p-8 border-b flex justify-between items-center bg-slate-50/30">
                            <div className="flex items-center">
                                <div className="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center mr-4 shadow-xl"><Leaf className="text-white w-6 h-6" /></div>
                                <div><h1 className="text-2xl font-black text-slate-900 uppercase italic leading-none">Nutri<span className="text-emerald-500">CRM</span></h1><p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.4em] mt-1 tracking-widest italic opacity-60">Protocolo Maestro SMAE v5.0</p></div>
                            </div>
                            <div className="text-right hidden print:block"><p className="text-sm font-black uppercase">Paciente: {pacientes.find(p => p.id == selectedPatientId)?.nombre || '--'}</p><p className="text-xs text-slate-500">Nutrición Especializada</p></div>
                        </div>
                        <div className="grid grid-cols-7 bg-emerald-600 text-white font-bold text-[9px] uppercase tracking-widest text-center py-4 border-b border-emerald-700 italic shadow-inner">
                            <div>Intervalo</div><div>Horario</div><div>Opción 1</div><div>Opción 2</div><div>Opción 3</div><div>Opción 4</div><div className="text-emerald-200">Equivalentes</div>
                        </div>
                        {momentos.map((m, i) => (
                            <div key={i} className="grid grid-cols-7 min-h-[100px] divide-x border-b last:border-0 bg-white hover:bg-emerald-50/20 transition-colors">
                                <div className="bg-slate-50/80 flex items-center justify-center p-3 text-[10px] font-bold text-slate-500 text-center uppercase tracking-wider">{m}</div>
                                <div className="flex items-center justify-center p-3 text-xs font-bold text-slate-400 italic">--:--</div>
                                {[1,2,3,4].map(op => (
                                    <div key={op} onClick={()=>setOpenSelector({dayIdx: i, opIdx: op})} className="p-3 hover:bg-emerald-50/40 cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-transparent hover:border-emerald-300 rounded-xl m-1 no-print-border">
                                        {planData[`${i}-${op}`] ? (
                                            <div className="text-center animate-in zoom-in duration-300"><p className="text-[12px] font-bold text-slate-900 uppercase italic">{planData[`${i}-${op}`].nombre}</p><span className="text-[9px] font-black text-emerald-600 uppercase tracking-widest mt-1">{planData[`${i}-${op}`].kcalTotales} KCAL</span></div>
                                        ) : (
                                            <PlusCircle className="w-5 h-5 text-slate-200 hover:text-emerald-400 transition-colors no-print" />
                                        )}
                                    </div>
                                ))}
                                <div className="bg-slate-50/50 p-4 flex flex-col justify-center space-y-2 text-[9px] font-medium text-slate-500 uppercase italic leading-tight"><span>2 Cereales</span><span>2.5 AOA M.B.</span></div>
                            </div>
                        ))}
                        <div className="p-8 bg-slate-900 text-white flex justify-between items-center no-print">
                            <div className="flex items-center space-x-6"><div><p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1 italic opacity-60">Paciente Referencia</p><p className="text-base font-bold italic uppercase">{pacientes.find(p => p.id == selectedPatientId)?.nombre || '-- SELECCIONE --'}</p></div></div>
                            <div className="flex space-x-3">
                                <button onClick={()=>window.print()} className="bg-slate-800 text-slate-300 px-5 py-2.5 rounded-lg font-bold text-xs uppercase tracking-widest hover:bg-slate-700 transition-all flex items-center shadow-md"><Printer className="w-4 h-4 mr-2" /> Imprimir</button>
                                <button onClick={generarPDF} className="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-bold text-xs uppercase tracking-widest hover:bg-blue-500 transition-all flex items-center shadow-md"><Download className="w-4 h-4 mr-2" /> Generar PDF</button>
                                <button className="bg-emerald-600 text-white px-6 py-2.5 rounded-lg font-bold text-xs uppercase tracking-widest shadow-md hover:bg-emerald-500 active:scale-95 transition-all flex items-center group italic shadow-md"><Save className="w-4 h-4 mr-2 group-hover:rotate-12 transition-transform" /> Guardar</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- APP PRINCIPAL (CON TODA TU LÓGICA Y LOCALSTORAGE) ---
        function App() {
            const [activeModule, setActiveModule] = useState('pacientes');
            const [editingPatientId, setEditingPatientId] = useState(null);
            const [showNewPatientModal, setShowNewPatientModal] = useState(false);

            // FUNCIÓN DE CARGA DESDE EL NAVEGADOR
            const getSavedData = (key, fallback) => {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : fallback;
            };

            // ESTADOS PERSISTENTES
            const [pacientes, setPacientes] = useState(() => getSavedData('nutri_pacientes', [
                { id: 1, nombre: 'Ana García', fecha: '11/03/2026', email: 'ana.garcia@clinica.com', telefono: '555-0101', motivoConsulta: 'Control de peso', diagnostico: 'Sobrepeso grado I', edad: 28, sexo: 'Femenino', pesoPerdido6m: 'No', pesoAumentado6m: 'No', apetitoCambiado: 'Igual', talla: 165, peso: 72, pesoDeseado: 60, pesoHabitual: 68, estado: 'Activo', patologicos: ['Gastritis'], recordatorio24h: [], planesHistorial: [] }
            ]));

            const [materiaPrima, setMateriaPrima] = useState(() => getSavedData('nutri_materia', [
                { id: 1, nombre: 'Pechuga de Pollo', grupo: 'AOA Muy Bajo Grasa', energia: 75, proteina: 7, lipidos: 1, hc: 0 },
                { id: 2, nombre: 'Manzana Picada', grupo: 'Fruta', energia: 65, proteina: 0.3, lipidos: 0.2, hc: 17.1 }
            ]));

            const [recetas, setRecetas] = useState(() => getSavedData('nutri_recetas', [
                { id: 1, nombre: 'Bowl Pollo SMAE', ingredientes: [{ id: 1, porcion: 3 }], kcalTotales: 225 },
                { id: 2, nombre: 'Avena con Manzana', ingredientes: [{ id: 2, porcion: 1 }], kcalTotales: 65 }
            ]));

            const [systemConfig, setSystemConfig] = useState(() => getSavedData('nutri_config', { fontFamily: 'Inter', logo: null }));

            // GUARDADO AUTOMÁTICO CADA VEZ QUE CAMBIA ALGO
            useEffect(() => { localStorage.setItem('nutri_pacientes', JSON.stringify(pacientes)); }, [pacientes]);
            useEffect(() => { localStorage.setItem('nutri_materia', JSON.stringify(materiaPrima)); }, [materiaPrima]);
            useEffect(() => { localStorage.setItem('nutri_recetas', JSON.stringify(recetas)); }, [recetas]);
            useEffect(() => { localStorage.setItem('nutri_config', JSON.stringify(systemConfig)); }, [systemConfig]);

            const agregarPaciente = (nuevo) => {
                const data = { id: Date.now(), nombre: nuevo.nombre, fecha: new Date().toLocaleDateString(), estado: 'Activo', patologicos: [], recordatorio24h: [], sexo: 'Femenino', diagnostico: 'Ingreso Maestro' };
                setPacientes([data, ...pacientes]);
                setShowNewPatientModal(false);
                setEditingPatientId(data.id);
            };

            const actualizarPaciente = (datos) => {
                setPacientes(prev => prev.map(p => p.id === datos.id ? datos : p));
                setEditingPatientId(null);
            };

            const pacienteEnEdicion = pacientes.find(p => p.id === editingPatientId);

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden text-slate-800" style={{ fontFamily: systemConfig.fontFamily }}>
                    {/* Sidebar */}
                    <aside className="w-64 bg-[#0F172A] flex flex-col shrink-0 z-20 shadow-xl border-r border-slate-800 no-print">
                        <div className="h-16 flex items-center px-6 border-b border-slate-800 text-white">
                            <div className="w-7 h-7 bg-emerald-500 rounded-md flex items-center justify-center mr-3"><Leaf className="text-white w-4 h-4" /></div>
                            <span className="text-base font-bold italic">Nutri<span className="text-emerald-500">CRM</span></span>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-1">
                            {[{id:'pacientes', label:'Pacientes', icon:Users}, {id:'dietas', label:'Dietas', icon:Leaf}, {id:'calendario', label:'Calendario', icon:CalendarDays}].map(item => (
                                <button key={item.id} onClick={()=>setActiveModule(item.id)} className={`w-full flex items-center px-4 py-2.5 rounded-xl text-[14px] font-semibold transition-all ${activeModule === item.id ? 'bg-emerald-600 text-white shadow-xl' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                    <item.icon className="w-4 h-4 mr-3" /> {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800"><button onClick={()=>setActiveModule('config')} className={`w-full flex items-center px-4 py-2.5 rounded-xl text-sm ${activeModule === 'config' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><Settings className="w-4 h-4 mr-3" /> Configuración</button></div>
                    </aside>

                    {/* Contenido Principal */}
                    <main className="flex-1 flex flex-col min-w-0 relative">
                        <header className="h-16 bg-white border-b flex items-center justify-between px-8 no-print shrink-0 shadow-sm backdrop-blur-md">
                            <div className="flex items-center space-x-2"><Monitor className="w-4 h-4 text-slate-400" /><h1 className="text-xs font-black text-slate-500 uppercase tracking-widest">{activeModule}</h1></div>
                            <div className="flex items-center space-x-4 pl-4 border-l border-slate-200"><span className="text-slate-400 text-xs font-bold uppercase hidden lg:inline">Dr. Eduardo Suárez</span><div className="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-black text-[10px] shadow-md uppercase italic leading-none">ES</div></div>
                        </header>

                        <div className="flex-1 overflow-auto p-8 bg-slate-50/50 scrollbar-hide">
                            {activeModule === 'pacientes' && (
                                <div className="max-w-6xl mx-auto space-y-6">
                                    <div className="flex justify-between items-center px-2">
                                        <div><h2 className="text-xl font-bold italic uppercase leading-none">Directorio Clínico</h2><p className="text-[11px] text-slate-400 font-bold mt-1 uppercase tracking-widest">Sincronización SMAE Maestro</p></div>
                                        <button onClick={()=>setShowNewPatientModal(true)} className="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow-lg hover:bg-emerald-700 transition-all flex items-center"><PlusCircle className="w-4 h-4 mr-2" /> Registrar Paciente</button>
                                    </div>
                                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50 border-b text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                                <tr><th className="px-8 py-5">Paciente / Expediente</th><th className="px-8 py-5 text-center">Estatus</th><th className="px-8 py-5"></th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {pacientes.map(p => (
                                                    <tr key={p.id} onClick={()=>setEditingPatientId(p.id)} className="hover:bg-emerald-50/20 cursor-pointer transition-all group">
                                                        <td className="px-8 py-4"><p className="text-sm font-bold text-slate-900 uppercase italic leading-none">{p.nombre}</p><p className="text-[10px] text-slate-400 font-bold uppercase mt-1">Última Sesión: {p.fecha}</p></td>
                                                        <td className="px-8 py-4 text-center"><span className="px-3 py-1 bg-emerald-50 text-emerald-700 text-[9px] font-black rounded-lg border border-emerald-100 uppercase tracking-widest">{p.estado}</span></td>
                                                        <td className="px-8 py-4 text-right"><ChevronRight className="w-5 h-5 text-slate-200 group-hover:text-emerald-500 transition-colors ml-auto" /></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeModule === 'dietas' && (
                                <div className="max-w-full mx-auto space-y-6">
                                    <div className="flex flex-col md:flex-row justify-between gap-4 border-b pb-4 border-slate-200 px-2">
                                        <div><h2 className="text-lg font-bold uppercase italic leading-none">Ingeniería SMAE v5.0</h2><p className="text-[11px] text-slate-400 font-bold mt-2 uppercase tracking-widest">Base de Datos y Planificación</p></div>
                                    </div>
                                    {/* Submódulos Integrados */}
                                    <div className="space-y-10">
                                        <section><SectionHeader title="Control de Insumos" /><SubModuloMateriaPrima data={materiaPrima} setData={setMateriaPrima} /></section>
                                        <section><SectionHeader title="Planificador Maestro" /><SubModuloPlanNutricional recetas={recetas} pacientes={pacientes} brandConfig={systemConfig} /></section>
                                    </div>
                                </div>
                            )}

                            {activeModule === 'calendario' && <div className="text-center py-40 opacity-30 italic font-black uppercase tracking-[1em]">Módulo Agenda Activo</div>}

                            {activeModule === 'config' && (
                                <div className="max-w-4xl mx-auto bg-white p-8 rounded-2xl border shadow-sm">
                                    <h2 className="text-xl font-bold uppercase italic border-b pb-4 mb-8">Ajustes Institucionales</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                        <div><Label>Logotipo Institucional</Label>
                                            <div className="h-44 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center relative group cursor-pointer hover:border-emerald-400 transition-all">
                                                {systemConfig.logo ? <img src={systemConfig.logo} alt="Logo" className="max-h-[80%] object-contain shadow-2xl" /> : <div className="text-center opacity-30"><Upload className="w-8 h-8 mx-auto mb-2 text-emerald-600" /><p className="text-[9px] font-bold uppercase">Cargar Imagen</p></div>}
                                                <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e)=>{ const reader = new FileReader(); reader.onload = (ev) => setSystemConfig({...systemConfig, logo: ev.target.result}); reader.readAsDataURL(e.target.files[0]); }} />
                                            </div>
                                        </div>
                                        <div className="space-y-6">
                                            <Label className="text-rose-500">Gestión de Datos Locales</Label>
                                            <button onClick={()=>{if(confirm('¿BORRAR TODA LA INFORMACIÓN? Esta acción es irreversible.')) {localStorage.clear(); window.location.reload();}}} className="w-full py-4 border-2 border-rose-100 bg-rose-50 text-rose-600 font-black text-xs uppercase tracking-widest rounded-xl hover:bg-rose-500 hover:text-white transition-all shadow-sm">Limpiar Base de Datos del CRM</button>
                                            <p className="text-[10px] text-slate-400 italic">Tus datos se guardan exclusivamente en este navegador.</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {showNewPatientModal && <ModalNuevoPaciente onClose={()=>setShowNewPatientModal(false)} onSave={agregarPaciente} />}
                        {editingPatientId && <ModalHistoriaClinicaCompleta paciente={pacienteEnEdicion} onClose={()=>setEditingPatientId(null)} onSave={actualizarPaciente} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
